# ==============================================================================
# ArgoCD Master Root Application: App-of-Apps Pattern
# Synchronizes Multi-Cluster Production Applications from GitOps Repository
# ==============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zomato-root-app-of-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: zomato-ai-platform

  source:
    repoURL: "https://github.com/KishorKumarParoi/AI-Engineering.git"
    targetRevision: HEAD
    path: "zomato-analysis/ops/argocd/applications"
    directory:
      recurse: false
      exclude: "root-app-of-apps.yaml"

  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
