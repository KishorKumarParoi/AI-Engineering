# ==============================================================================
# Ansible Inventory: Multi-Cloud Production CI/CD & Operations Infrastructure
# ==============================================================================

[jenkins_masters]
jenkins-primary.aws.internal ansible_host=10.0.1.50 ansible_user=ubuntu environment_tier=primary cloud_provider=aws

[ci_agents]
agent-build-01.aws.internal ansible_host=10.0.2.110 ansible_user=ubuntu executor_slots=4
agent-build-02.gcp.internal ansible_host=10.10.1.120 ansible_user=ubuntu executor_slots=4

[k8s_bastions]
bastion.aws.internal ansible_host=10.0.1.10 ansible_user=ubuntu cloud_provider=aws
bastion.gcp.internal ansible_host=10.10.0.10 ansible_user=ubuntu cloud_provider=gcp

[cicd:children]
jenkins_masters
ci_agents

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
k8s_version="1.30.0"
trivy_version="0.51.1"
argocd_version="v2.11.2"
