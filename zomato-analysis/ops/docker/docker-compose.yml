services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlops-mlflow-server
    ports:
      - "5001:5000"
    environment:
      - BACKEND_STORE_URI=sqlite:////mlflow/mlflow.db
      - ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000

  app:
    build:
      context: ../../1. ALL MATERIAL - 5 - NEW/CODE
      dockerfile: ../../../ops/docker/Dockerfile.app
    container_name: colorectal-cancer-serving
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    volumes:
      - ../../1. ALL MATERIAL - 5 - NEW/CODE/artifacts:/app/artifacts

volumes:
  mlflow-data:
