apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: colorectal-cancer-hpa
  namespace: mlops-system
  labels:
    app: colorectal-cancer-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: colorectal-cancer-serving
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
