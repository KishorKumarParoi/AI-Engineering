apiVersion: apps/v1
kind: Deployment
metadata:
  name: colorectal-cancer-serving
  namespace: mlops-system
  labels:
    app: colorectal-cancer-app
    tier: serving
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: colorectal-cancer-app
  template:
    metadata:
      labels:
        app: colorectal-cancer-app
    spec:
      containers:
        - name: serving-container
          image: kishorkumarparoi/colorectal-cancer-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mlops-config
            - secretRef:
                name: mlops-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: artifact-volume
              mountPath: /app/artifacts
      volumes:
        - name: artifact-volume
          persistentVolumeClaim:
            claimName: mlops-artifacts-pvc
