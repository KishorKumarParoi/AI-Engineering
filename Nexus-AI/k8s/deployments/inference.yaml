# ──────────────────────────────────────────────────────────────
# Nexus-AI: K8s Deployment — Inference API
# ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-inference
  namespace: nexus-ai
  labels:
    app: nexus-inference
    tier: serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-inference
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nexus-inference
        tier: serving
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: nexus-ai-sa
      containers:
        - name: inference
          image: nexus-ai/inference:latest
          ports:
            - containerPort: 8081
              name: http
              protocol: TCP
          env:
            - name: PYTHONPATH
              value: /app
            - name: NEXUS_PROVIDER
              value: local
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: model-artifacts
              mountPath: /app/mlops/artifacts
              readOnly: true
      volumes:
        - name: model-artifacts
          persistentVolumeClaim:
            claimName: nexus-model-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-inference-svc
  namespace: nexus-ai
  labels:
    app: nexus-inference
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
  selector:
    app: nexus-inference
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexus-inference-hpa
  namespace: nexus-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexus-inference
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
