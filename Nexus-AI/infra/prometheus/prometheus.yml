# ──────────────────────────────────────────────────────────────
# Nexus-AI: Prometheus Configuration
# ──────────────────────────────────────────────────────────────
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # ── Nexus-AI Inference Server ──────────────────────────────
  - job_name: "nexus-inference"
    metrics_path: /metrics
    static_configs:
      - targets: ["nexus-api:8081"]
        labels:
          service: "inference"
          environment: "production"

  # ── Prometheus Self-Monitoring ─────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── Node Exporter (K8s) ───────────────────────────────────
  - job_name: "node-exporter"
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__address__]
        regex: "(.*):10250"
        replacement: "${1}:9100"
        target_label: __address__

  # ── File-based metrics (training runs) ─────────────────────
  - job_name: "nexus-training-metrics"
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/nexus_targets.json
        refresh_interval: 30s
