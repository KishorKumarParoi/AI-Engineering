[project]
name = "nexus-ai"
version = "1.0.0"
description = "Enterprise Multi-Cloud Lakehouse, MLOps & Autonomous 5-Agent AI Mesh"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kishor Kumar Paroi" }
]

dependencies = [
    # Core Data Processing
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "duckdb>=1.0.0",
    "pyarrow>=17.0.0",
    "faker>=28.0.0",

    # ETL & Data Quality
    "great-expectations>=1.0.0",
    "pydantic>=2.8.0",
    "python-geohash>=0.8.5",

    # ML & MLOps
    "scikit-learn>=1.5.0",
    "lightgbm>=4.4.0",
    "xgboost>=2.1.0",
    "optuna>=3.6.0",
    "mlflow>=2.16.0",
    "prometheus-client>=0.21.0",

    # AI Agents
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "openai>=1.45.0",

    # AI Security
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",

    # API & Backend
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",

    # Cloud SDKs
    "google-cloud-storage>=2.18.0",
    "google-cloud-bigquery>=3.25.0",
    "boto3>=1.35.0",
    "azure-storage-blob>=12.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "pre-commit>=3.8.0",
]
voice = [
    "deepgram-sdk>=3.5.0",
    "pyttsx3>=2.90",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
