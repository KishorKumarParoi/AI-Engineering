version: '3.8'

services:
  postgres:
    build: .
    container_name: data_agent_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-data_agent_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
