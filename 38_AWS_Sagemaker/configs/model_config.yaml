dataset:
  target_column: "price_range"
  id_column: null
  features:
    - battery_power
    - blue
    - clock_speed
    - dual_sim
    - fc
    - four_g
    - int_memory
    - m_dep
    - mobile_wt
    - n_cores
    - pc
    - px_height
    - px_width
    - ram
    - sc_h
    - sc_w
    - talk_time
    - three_g
    - touch_screen
    - wifi

  target_classes:
    0: "Low Cost"
    1: "Medium Cost"
    2: "High Cost"
    3: "Very High Cost"

split:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  random_state: 42

hyperparameters:
  n_estimators: 150
  max_depth: 15
  min_samples_split: 4
  min_samples_leaf: 2
  random_state: 42
  criterion: "gini"

quality_gate:
  min_accuracy_threshold: 0.85
  min_f1_macro_threshold: 0.83
