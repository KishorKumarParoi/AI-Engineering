name: SageMaker MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    name: Test & Validate SageMaker Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Pytest Test Suite
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: |
          pytest -v tests/

      - name: Compile and Validate SageMaker Pipeline DAG
        env:
          AWS_DEFAULT_REGION: us-east-1
          SAGEMAKER_SUPPRESS_V2_WARNING: "1"
        run: |
          python src/pipeline/run_pipeline.py --build-only --output artifacts/pipeline_definition.json
          python -c "import json; data=json.load(open('artifacts/pipeline_definition.json')); print('DAG Validated! Total Steps:', len(data['Steps']))"

      - name: Upload Pipeline Definition Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sagemaker-pipeline-definition
          path: artifacts/pipeline_definition.json
