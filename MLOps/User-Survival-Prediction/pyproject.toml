[project]
name = "user-survival-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "apache-airflow-providers-postgres>=7.0.2",
    "flask>=3.1.3",
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.3.0",
    "numpy<2.0.0",
    "pandas<3.0.0",
    "psycopg2>=2.9.13",
    "redis>=8.1.0",
    "scikit-learn>=1.6.0",
    "setuptools>=84.0.0",
    "alibi-detect>=0.13.0",
    "prometheus-client>=0.21.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]
