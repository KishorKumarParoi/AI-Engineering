[project]
name = "user-survival-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apache-airflow-providers-postgres>=7.0.2",
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.3.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psycopg2>=2.9.13",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "setuptools>=84.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]
