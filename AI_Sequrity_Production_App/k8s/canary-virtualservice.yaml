apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: enterprise-rag-canary-router
  namespace: ai-production
spec:
  hosts:
    - "api.security.enterprise.internal"
  gateways:
    - mesh
    - ai-ingress-gateway
  http:
    # Rule 1: Header-based routing for internal QA and red-teaming testers
    - match:
        - headers:
            x-canary-tester:
              exact: "true"
      route:
        - destination:
            host: enterprise-rag-api-svc
            subset: canary
          weight: 100

    # Rule 2: Production Canary Split (90% Stable, 10% Canary Candidate)
    - route:
        - destination:
            host: enterprise-rag-api-svc
            subset: stable
          weight: 90
        - destination:
            host: enterprise-rag-api-svc
            subset: canary
          weight: 10
      timeout: 10s
      retries:
        attempts: 2
        perTryTimeout: 3s
        retryOn: "5xx,connect-failure,refused-stream"
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: enterprise-rag-subsets
  namespace: ai-production
spec:
  host: enterprise-rag-api-svc
  trafficPolicy:
    loadBalancer:
      simple: LEAST_CONN
    connectionPool:
      tcp:
        maxConnections: 1024
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
  subsets:
    - name: stable
      labels:
        version: v2.0.0
    - name: canary
      labels:
        version: v2.1.0
