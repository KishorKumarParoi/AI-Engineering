services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise-rag:latest
    container_name: rag-api
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "80:8080"
    env_file:
      - .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; req=urllib.request.Request('http://localhost:8080/health', headers={'User-Agent': 'HealthCheck/1.0'}); resp=urllib.request.urlopen(req); exit(0 if resp.status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise-rag:latest
    container_name: rag-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://api:8080
    command: ["streamlit", "run", "ui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    depends_on:
      api:
        condition: service_healthy
